---
name: build

# Validates that the dependency tree resolves and installs, that poetry.lock is
# in sync with pyproject.toml, runs the smoke tests (entry points import and
# click commands respond to --help), and checks that declared dependencies match
# what the code actually imports. No MongoDB or network is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: poetry
      - name: Check pyproject and lockfile are in sync
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Smoke tests (entry points + CLI --help)
        run: poetry run pytest -q
      - name: Dependency hygiene (config in pyproject.toml [tool.deptry])
        run: poetry run deptry .
