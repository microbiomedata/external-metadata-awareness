---
name: ruff

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ruff
        run: python3 -m pip install ruff==0.15.17
      - name: Lint (code-quality rules; config in pyproject.toml [tool.ruff])
        run: ruff check .
